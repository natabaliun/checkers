<!-- Файл: frontend/src/shared/assets/default_avatar.svg -->

<svg
        width="100"
        height="100"
        viewBox="0 0 100 100"
        version="1.1"
        xmlns="http://www.w3.org/2000/svg">
    <defs>
        <clipPath id="circleClip">
            <circle cx="50" cy="50" r="50" />
        </clipPath>
    </defs>
    <g clip-path="url(#circleClip)">
        <!-- Фон -->
        <rect width="100" height="100" fill="#e0e0e0" />

        <!-- Голова -->
        <circle
                cx="50"
                cy="40"
                r="20"
                fill="#bdbdbd" />

        <!-- Тело -->
        <path
                d="M 20,100 C 20,80 80,80 80,100 Z"
                fill="#bdbdbd" />
    </g>
</svg>