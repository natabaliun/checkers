<!-- Файл: frontend/src/shared/assets/bot_black_avatar.svg -->

<svg
        width="100"
        height="100"
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg">
    <defs>
        <clipPath id="circleClip">
            <circle cx="50" cy="50" r="50"/>
        </clipPath>
    </defs>
    <g clip-path="url(#circleClip)">
        <!-- Фон -->
        <rect width="100" height="100" fill="#37474f"/>
        <!-- Голова -->
        <rect x="35" y="30" width="30" height="30" rx="4" fill="#78909c"/>
        <!-- Глаз-индикатор -->
        <circle cx="50" cy="45" r="5" fill="#ff5252">
            <animate attributeName="r" values="5;7;5" dur="1.5s" repeatCount="indefinite" />
        </circle>
        <!-- Тело -->
        <rect x="25" y="65" width="50" height="35" rx="8" fill="#546e7a"/>
    </g>
</svg>