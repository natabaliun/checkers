<!-- Файл: frontend/src/shared/assets/bot_white_avatar.svg -->

<svg
        width="100"
        height="100"
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg">
    <defs>
        <clipPath id="circleClip">
            <circle cx="50" cy="50" r="50"/>
        </clipPath>
    </defs>
    <g clip-path="url(#circleClip)">
        <!-- Фон -->
        <rect width="100" height="100" fill="#f5f5f5"/>
        <!-- Голова -->
        <rect x="35" y="30" width="30" height="30" rx="4" fill="#90a4ae"/>
        <!-- Глаз-индикатор -->
        <circle cx="50" cy="45" r="5" fill="#ffffff">
            <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite" />
        </circle>
        <!-- Тело -->
        <rect x="25" y="65" width="50" height="35" rx="8" fill="#b0bec5"/>
    </g>
</svg>